<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de pedidos | Totem Festas</title><style>body{font-family:system-ui;background:#fff6fa;color:#39243a;margin:0}header{background:#c21872;color:white;padding:18px 25px}main{max-width:1000px;margin:25px auto;padding:0 16px}.card{background:white;padding:20px;border-radius:15px;margin:14px 0;border:1px solid #efd5e1}input,button,select{font:inherit;padding:12px;border-radius:10px;margin:5px}input{border:1px solid #ddd} .product-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #eee;padding:10px 0}.product-row strong{flex:1;min-width:200px}.product-row button{padding:9px}.off{opacity:.55}#productForm input{max-width:240px}#productForm label{display:inline-block;margin:8px}button{border:0;background:#c21872;color:white;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none}.muted{color:#725e6b}.items{white-space:pre-wrap}.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center}@media print{header,#login,#controls,button,.no-print{display:none!important}body{background:white}.card{border:0}main{margin:0}}</style></head><body><header><h1>🎉 Central de pedidos — Totem Festas</h1></header><main><section id="login" class="card"><h2>Entrar como administrador</h2><form id="form"><input type="email" id="email" placeholder="E-mail" required autocomplete="username"><input type="password" id="password" placeholder="Senha" required autocomplete="current-password"><button>Entrar</button></form></section><section id="dashboard" class="hidden"><div id="controls" class="bar"><div><button id="sound">🔔 Ativar som</button><button id="logout">Sair</button></div><strong id="counter"></strong></div><div class="bar no-print"><button id="showOrders">📦 Pedidos</button><button id="showProducts">🛍️ Gerenciar produtos</button></div><section id="productManager" class="hidden no-print"><div class="card"><h2>Produtos do totem</h2><p class="muted">Adicione, edite ou marque como indisponível. As mudanças aparecem no totem conectado à internet.</p><form id="productForm"><input type="hidden" id="editId"><label>Nome<br><input id="productName" maxlength="100" required placeholder="Nome do produto"></label><label>Categoria<br><input id="productCategory" maxlength="50" required placeholder="Ex.: Festas"></label><label>Preço (R$)<br><input id="productPrice" type="number" min="0.01" max="999999" step="0.01" required placeholder="0,00"></label><button type="submit" id="saveProduct">Salvar produto</button><button type="button" id="cancelEdit">Cancelar edição</button></form><p id="catalogStatus" class="muted"></p><div id="productList"></div></div></section><section id="orderManager"><p class="muted" id="status">Conectando...</p><div id="orders"></div></section><div id="orders"></div></section><p id="error" role="alert"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,query,orderBy,limit,onSnapshot,doc,updateDoc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const ADMIN_UID='n8r0xqMKGfRLV09emJ84p8JTWgb2', $=id=>document.getElementById(id);
let unsubscribe=null,soundEnabled=false,audio=null,initial=true,known=new Set(),catalogUnsubscribe=null,products=[{id:1,category:'Adesivos',name:'Adesivo personalizado 5×5 cm',price:0,detail:'Preço a confirmar'},{id:2,category:'Personalizados',name:'Topo de bolo personalizado',price:0,detail:'Preço a combinar no caixa'},{id:3,category:'Painéis',name:'Painel de mesa 40×40 cm',price:80},{id:4,category:'Festas',name:'Arranjo de balões',price:38.90},{id:5,category:'Festas',name:'Balão número 40 cm',price:5},{id:6,category:'Festas',name:'Balão número 70 cm',price:8},{id:7,category:'Personalizados',name:'Medalha de EVA 15 cm',price:5},{id:8,category:'Personalizados',name:'Tubete personalizado',price:0,detail:'Preço a combinar no caixa'}],catalogReady=false;
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function el(tag,content){const e=document.createElement(tag);e.textContent=String(content??'');return e}
function err(message){$('error').textContent=message}
$('form').addEventListener('submit',async e=>{e.preventDefault();err('');try{const c=await signInWithEmailAndPassword(auth,$('email').value,$('password').value);if(c.user.uid!==ADMIN_UID){await signOut(auth);throw Error('Este usuário não está autorizado como administrador.')}}catch(ex){err('Não foi possível entrar: '+ex.message)}});
$('logout').onclick=()=>signOut(auth);
$('sound').onclick=async()=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();soundEnabled=true;$('sound').textContent='🔔 Som ativado'}catch(e){err('Não foi possível ativar o som: '+e.message)}};
function beep(){if(!soundEnabled||!audio)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.frequency.value=880;gain.gain.value=.08;osc.start();osc.stop(audio.currentTime+.22)}
$('showOrders').onclick=()=>{$('orderManager').classList.remove('hidden');$('productManager').classList.add('hidden')};
$('showProducts').onclick=()=>{$('orderManager').classList.add('hidden');$('productManager').classList.remove('hidden')};
function drawProducts(){const list=$('productList');list.replaceChildren();for(const p of products){const row=document.createElement('div');row.className='product-row'+(p.available===false?' off':'');const label=el('strong',p.name+' — '+p.category+' — '+money(p.price)+(p.available===false?' (Indisponível)':''));const edit=el('button','✏️ Editar');edit.onclick=()=>{$('editId').value=p.id;$('productName').value=p.name;$('productCategory').value=p.category;$('productPrice').value=p.price;$('productName').focus()};const toggle=el('button',p.available===false?'Disponibilizar':'Indisponibilizar');toggle.onclick=()=>saveCatalog(products.map(x=>String(x.id)===String(p.id)?{...x,available:p.available===false}:x));row.append(label,edit,toggle);list.append(row)}}
async function saveCatalog(next){$('catalogStatus').textContent='Salvando...';try{await setDoc(doc(db,'config','catalogo'),{items:next});$('catalogStatus').textContent='Alterações salvas!'}catch(e){$('catalogStatus').textContent='Erro ao salvar: '+e.message}}
$('productForm').onsubmit=async e=>{e.preventDefault();const name=$('productName').value.trim(),category=$('productCategory').value.trim(),price=Number($('productPrice').value),editId=$('editId').value;if(!name||!category||!Number.isFinite(price)||price<=0)return err('Informe nome, categoria e preço maior que zero.');const item={id:editId||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)),name,category,price:Math.round(price*100)/100,available:true};await saveCatalog(editId?products.map(p=>String(p.id)===editId?{...p,...item,available:p.available!==false}:p):[...products,item]);$('productForm').reset();$('editId').value=''};
$('cancelEdit').onclick=()=>{$('productForm').reset();$('editId').value=''};
function renderOrder(s){const o=s.data(),card=document.createElement('article');card.className='card';card.append(el('h3','Pedido #'+s.id.slice(0,8)),el('p','Cliente: '+o.customer),el('p','Telefone: '+(o.phone||'Não informado')),el('p','Valor informado: '+money(o.total)),el('p','Situação: '+o.status));const d=o.createdAt?.toDate?.();if(d)card.append(el('p','Recebido: '+d.toLocaleString('pt-BR')));const ul=document.createElement('ul');for(const p of Array.isArray(o.items)?o.items:[]){ul.append(el('li',String(p.qty||1)+'× '+String(p.name||'Produto')+' — '+String(p.custom||'')+' '+String(p.notes||'')))}card.append(ul);const print=document.createElement('button');print.textContent='🖨️ Imprimir pedido';print.onclick=()=>{const win=window.open('','_blank');if(!win){err('Permita janelas pop-up para imprimir.');return}const style=win.document.createElement('style');style.textContent='body{font-family:Arial;padding:20px}button{display:none}';win.document.head.append(style);win.document.body.append(card.cloneNode(true));win.focus();win.print()};card.append(print);const statuses=['Aguardando pagamento','Pago','Em produção','Concluído','Cancelado'];const select=document.createElement('select');for(const st of statuses){const opt=new Option(st,st);select.add(opt)}select.value=o.status;select.onchange=async()=>{try{await updateDoc(doc(db,'pedidos',s.id),{status:select.value})}catch(e){err('Falha ao alterar status: '+e.message)}};card.append(select);return card}
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}if(catalogUnsubscribe){catalogUnsubscribe();catalogUnsubscribe=null}const allowed=user&&user.uid===ADMIN_UID;$('login').classList.toggle('hidden',!!allowed);$('dashboard').classList.toggle('hidden',!allowed);if(!allowed){if(user)err('Conta sem permissão de administrador.');return}err('');initial=true;known=new Set();catalogUnsubscribe=onSnapshot(doc(db,'config','catalogo'),snap=>{if(snap.exists()&&Array.isArray(snap.data().items)){products=snap.data().items;catalogReady=true;$('catalogStatus').textContent='Catálogo sincronizado'}else{products=[{id:1,category:'Adesivos',name:'Adesivo personalizado 5×5 cm',price:0,detail:'Preço a confirmar'},{id:2,category:'Personalizados',name:'Topo de bolo personalizado',price:0,detail:'Preço a combinar no caixa'},{id:3,category:'Painéis',name:'Painel de mesa 40×40 cm',price:80},{id:4,category:'Festas',name:'Arranjo de balões',price:38.90},{id:5,category:'Festas',name:'Balão número 40 cm',price:5},{id:6,category:'Festas',name:'Balão número 70 cm',price:8},{id:7,category:'Personalizados',name:'Medalha de EVA 15 cm',price:5},{id:8,category:'Personalizados',name:'Tubete personalizado',price:0,detail:'Preço a combinar no caixa'}];catalogReady=false;$('catalogStatus').textContent='Catálogo inicial: salve um produto para ativar a sincronização'}drawProducts()},e=>err('Erro ao carregar catálogo: '+e.message));unsubscribe=onSnapshot(query(collection(db,'pedidos'),orderBy('createdAt','desc'),limit(100)),snap=>{const ids=new Set(snap.docs.map(d=>d.id));if(!initial&&snap.docs.some(d=>!known.has(d.id)))beep();initial=false;known=ids;$('status').textContent='Atualizado em '+new Date().toLocaleTimeString('pt-BR');$('counter').textContent=snap.size+' pedidos recentes';$('orders').replaceChildren(...snap.docs.map(renderOrder))},e=>err('Erro ao carregar pedidos: '+e.message))});
</script></body></html>
